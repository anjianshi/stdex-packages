packages:
  - ./**
allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@scarf/scarf': true
  '@swc/core': true
  core-js: true
  esbuild: true
  prisma: true
  unrs-resolver: true
  workerd: true
minimumReleaseAgeExclude:
  - '@stdex/presets-eslint-base@1.2.0'
  - '@stdex/presets-eslint-node@1.2.0'
  - '@stdex/presets-eslint-typescript@1.2.0'
  - '@stdex/presets-prettier@1.2.0'
  - '@stdex/presets-typescript@1.2.0'
  - '@stdex/utils@1.2.0'
